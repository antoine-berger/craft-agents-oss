name: Fork release

# Publishing is explicit. A merge never restarts a server or upgrades an app.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable fork version, for example 0.15.7'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            target: mac
          - os: ubuntu-latest
            target: server
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject a source tree that loses deployed fixes
        run: python3 scripts/fork-update/verify-release-base.py --source-root .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Validate version and stamp package metadata
        env:
          FORK_VERSION: ${{ inputs.version }}
        run: |
          bun -e "import {versionParts} from './apps/electron/src/main/fork-release'; versionParts(process.env.FORK_VERSION); for(const path of ['package.json','apps/electron/package.json','packages/shared/package.json']){const pkg=await Bun.file(path).json();pkg.version=process.env.FORK_VERSION;await Bun.write(path,JSON.stringify(pkg,null,2)+'\n')}"
      - name: Refresh workspace versions in the release lockfile
        run: bun install --lockfile-only --ignore-scripts
      - name: Focused updater checks
        run: |
          bun test apps/electron/src/main/__tests__/fork-release.test.ts
          bun test apps/electron/src/transport/__tests__/thin-client-updates.test.ts
          bun test ./apps/electron/src/main/__tests__/fork-update.isolated.ts
          bun test ./apps/electron/src/main/__tests__/thin-client-cleanup.test.ts
          python3 -m unittest discover -s scripts/fork-update -p 'test_*.py'
      - name: Deployed-feature regressions
        run: |
          bun test packages/server-core/src/services/pr-watch packages/server-core/src/services/session-attention/service.test.ts packages/server-core/src/sessions/session-runtime-recovery.test.ts packages/server-core/src/sessions/native-continuations.test.ts packages/server-core/src/services/repositories/owned-worktree.test.ts packages/server-core/src/services/checkpoints/session-checkpoints.test.ts
          bun test apps/electron/src/renderer/atoms/__tests__/session-runtime-recovery.test.ts apps/electron/src/renderer/event-processor/handlers/__tests__/text-message-id-sync.test.ts
          bun test apps/electron/src/renderer/hooks/__tests__/usePrWatch.test.ts
          bun test apps/electron/src/renderer/components/app-shell/chat-header/pr-watch/pr-quick-actions.test.ts
          bun test --tsconfig-override apps/electron/tsconfig.json ./apps/electron/src/renderer/components/app-shell/chat-header/pr-watch/saved-pr-chip.isolated.tsx
          bun test ./packages/shared/src/agent/__tests__/claude-native-controller.isolated.ts
      - name: Build Mac app
        if: matrix.target == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          bun run electron:build
          bun scripts/fork-update/prepare-mac.ts
          cd apps/electron
          bunx electron-builder --mac zip --arm64 --publish never --config.mac.identity=-
          codesign --verify --deep --strict 'release/mac-arm64/Craft Agents.app'
      - name: Build server source distribution
        if: matrix.target == 'server'
        run: |
          bun run server:build:subprocess
          bun run build:wa-worker
          bun run webui:build
          mkdir -p dist/fork-server
          git archive HEAD | tar -x -C dist/fork-server
          cp package.json dist/fork-server/package.json
          cp bun.lock dist/fork-server/bun.lock
          cp apps/electron/package.json dist/fork-server/apps/electron/package.json
          cp packages/shared/package.json dist/fork-server/packages/shared/package.json
          cp -R apps/webui/dist dist/fork-server/apps/webui/dist
          cp -R packages/pi-agent-server/dist dist/fork-server/packages/pi-agent-server/dist
          cp -R packages/messaging-whatsapp-worker/dist dist/fork-server/packages/messaging-whatsapp-worker/dist
          tar -czf dist/craft-server-linux-x64.tar.gz -C dist/fork-server .
      - uses: actions/upload-artifact@v4
        with:
          name: fork-${{ matrix.target }}
          path: |
            apps/electron/release/Craft-Agents-arm64.zip
            dist/craft-server-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p publish
          find artifacts -name Craft-Agents-arm64.zip -exec cp '{}' publish/ \;
          find artifacts -name craft-server-linux-x64.tar.gz -exec cp '{}' publish/ \;
          python3 scripts/fork-update/verify-release-base.py --server-archive publish/craft-server-linux-x64.tar.gz --mac-archive publish/Craft-Agents-arm64.zip
          bun scripts/fork-update/manifest.ts "$FORK_VERSION" publish
          gh release create "fork-v$FORK_VERSION" publish/* --target "$SOURCE_SHA" --title "Craft fork $FORK_VERSION" --draft --notes 'Version du fork personnel. Installation manuelle depuis Update. Le serveur nécessite une autorisation de redémarrage distincte.'
          gh release edit "fork-v$FORK_VERSION" --draft=false --latest
